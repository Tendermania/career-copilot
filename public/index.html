<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Career Copilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233c6e71'/%3E%3Cpath d='M9 20c3-8 11-8 14 0' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12' r='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="brand"><span class="logo" aria-hidden="true"></span>Career Copilot</div>
    <div class="topbar-right">
      <label class="focus-wrap" title="Active job focus"><span class="sr-only">Active job focus</span><select class="focus-pill" id="focusPill"></select></label>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
